name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eiraos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eiraos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          pip install -e ".[test]" pytest pytest-asyncio httpx

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit

      - name: Build and verify release image
        run: |
          docker build --tag eiraos-ci:${{ github.sha }} .
          docker run --rm eiraos-ci:${{ github.sha }} \
            python -c "import eiraos; import eiraos.main"
          container_id="$(docker run --detach eiraos-ci:${{ github.sha }})"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec "$container_id" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

      - name: Verify database migration chain
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eiraos_test
          SECRET_KEY: test-secret-key-not-for-production-use-32b
          APP_ENV: development
          PYTHONPATH: .
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1

      - name: Unit & integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eiraos_test
          SECRET_KEY: test-secret-key-not-for-production-use-32b
          APP_ENV: development
          PYTHONPATH: .
        run: |
          pytest tests/ -q --tb=short \
            -k "not postgres_concurrency and not postgres_qualification"

      - name: Postgres concurrency and recovery qualification
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eiraos_test
          SECRET_KEY: test-secret-key-not-for-production-use-32b
          APP_ENV: development
          PYTHONPATH: .
        run: |
          pytest tests/test_idempotency_postgres_concurrency.py \
            tests/test_f8_02_postgres_qualification.py -v --tb=short
