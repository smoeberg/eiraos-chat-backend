name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eiraos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eiraos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Diagnose checkout and Python imports
        run: |
          echo "=== GIT HEAD ==="
          git rev-parse HEAD
          echo "=== CHAT FILE ==="
          git status --short
          grep -n "DEFAULT_HISTORY_TOKEN_BUDGET\|MAX_KNOWLEDGE_SCOPE_CHARS\|_build_messages\|_next_chunk\|_sanitize" src/eiraos/api/v1/chat.py || true
          echo "=== PYTHON IMPORT ==="
          python -c "import eiraos.api.v1.chat as c; print(c.__file__); print('DEFAULT_HISTORY_TOKEN_BUDGET=', getattr(c, 'DEFAULT_HISTORY_TOKEN_BUDGET', '<MISSING>')); print('MAX_KNOWLEDGE_SCOPE_CHARS=', getattr(c, 'MAX_KNOWLEDGE_SCOPE_CHARS', '<MISSING>')); print('_build_messages=', hasattr(c, '_build_messages')); print('_next_chunk=', hasattr(c, '_next_chunk')); print('_sanitize=', hasattr(c, '_sanitize'))"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pytest pytest-asyncio httpx

      - name: Unit & integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eiraos_test
          SECRET_KEY: test-secret-key-not-for-production-use-32b
          APP_ENV: development
          PYTHONPATH: .
        run: |
          pytest tests/ -q --tb=short \
            -k "not postgres_concurrency"

      - name: Postgres idempotency concurrency tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eiraos_test
          SECRET_KEY: test-secret-key-not-for-production-use-32b
          APP_ENV: development
          PYTHONPATH: .
        run: |
          pytest tests/test_idempotency_postgres_concurrency.py -v --tb=short
