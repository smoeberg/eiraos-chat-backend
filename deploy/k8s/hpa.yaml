apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eiraos-chat-backend
  namespace: eiraos-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eiraos-chat-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
