apiVersion: apps/v1
kind: Deployment
metadata:
  name: eiraos-worker
  labels:
    app: eiraos-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eiraos-worker
  template:
    metadata:
      labels:
        app: eiraos-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: ghcr.io/smoeberg/eiraos-chat-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["arq", "eiraos.workers.tasks.WorkerSettings"]
        env:
        - name: APP_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: eiraos-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: eiraos-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: eiraos-secrets
              key: jwt-secret-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: eiraos-secrets
              key: openai-api-key
              optional: true
        - name: CORS_ORIGINS
          value: "https://app.eiraos.ai,https://admin.eiraos.ai"
        - name: TRUSTED_HOSTS
          value: "api.eiraos.ai"
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
