apiVersion: apps/v1
kind: Deployment
metadata:
  name: eiraos-chat-backend
  namespace: eiraos-production
  labels:
    app: eiraos-chat-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eiraos-chat-backend
  template:
    metadata:
      labels:
        app: eiraos-chat-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/smoeberg/eiraos-chat-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: eiraos-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: eiraos-secrets
              key: redis-url
              optional: true
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: eiraos-secrets
              key: jwt-secret-key
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: tmp
        emptyDir: {}
